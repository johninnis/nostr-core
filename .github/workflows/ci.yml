name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # composer.json declares php ^8.4, so 8.5 is a supported runtime; testing only the
    # floor would leave the upper half of that range unverified by anything.
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, mbstring, sodium, ffi, gmp
          coverage: none
          tools: composer:v2

      - name: Install libsecp256k1 (exercise the FFI crypto path)
        run: sudo apt-get update && sudo apt-get install -y libsecp256k1-1

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-php${{ matrix.php-version }}-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Run tests + PHPStan
        run: composer test

      - name: Check code style
        run: composer check-style

      - name: Check Rector (8.4 modernisation)
        run: composer check-rector

  # The README offers a gmp-only deployment (no ext-ffi, no libsecp256k1) as a supported
  # configuration. Nothing verified it: the suite errored on the NIP-49 tests and the
  # FFI-path skips tripped failOnSkipped. This leg runs what such a host can actually run.
  pure-php:
    name: pure-PHP fallback (no ext-ffi, no libsecp256k1)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP without ext-ffi
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, sodium, gmp
          ini-values: ffi.enable=0
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist --ignore-platform-req=ext-ffi

      - name: Run the suite the pure-PHP path supports
        run: composer test-no-ffi
